name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # Config pública de cliente (se compila dentro del bundle JS de todos
        # modos): la anon key de Supabase es de rol "anon" por diseño y el GTM
        # ID es visible en cualquier página. Vive aquí porque .env ya no está
        # trackeado en git (PR #68) y este workflow es la única fuente del
        # build de producción. Si se rotan las claves, actualizar estos valores.
        env:
          VITE_SUPABASE_PROJECT_ID: romsnsprhofhviywites
          VITE_SUPABASE_URL: https://romsnsprhofhviywites.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvbXNuc3ByaG9maHZpeXdpdGVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4MTE4MTIsImV4cCI6MjA4NTM4NzgxMn0.Gda0AEYVdmWpErfjxtpHDo7GNiBXhmTV4cDuj3k-9X8
          VITE_GTM_ID: GTM-PCZW9KGK

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Notify IndexNow (Bing, and by extension ChatGPT Search / Perplexity) that
  # content changed, so they recrawl within minutes instead of on their own
  # schedule. Runs only after a successful deploy and reads the LIVE sitemap,
  # so it pings exactly what is published. Ownership is proven by the
  # public/<key>.txt file served at the site root.
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ping IndexNow
        run: node scripts/indexnow-ping.mjs
